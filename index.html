<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- 图片和媒体都来自 B 站自己的域名，带上来源会被它的 CDN 白名单拒掉 -->
<meta name="referrer" content="no-referrer">
<title>B站搜索器</title>
<style>
/* ---------- 设计令牌（Cupertino 系统风格） ---------- */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", Roboto, sans-serif;
  --accent:#007AFF; --danger:#FF3B30; --success:#34C759; --warn:#FF9500;

  --bg:#F2F2F7; --card:#FFFFFF; --elevated:#FFFFFF; --fill:#E9E9EB;
  --label:#1C1C1E; --label2:#3C3C43CC; --label3:#8E8E93; --sep:#E5E5EA;
  --shadow:0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.10);
  --shadow-sm:0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.06);

  --r-control:12px; --r-card:16px; --r-sheet:20px;
  --gap:16px; --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1C1C1E; --elevated:#2C2C2E; --fill:#2C2C2E;
    --label:#FFFFFF; --label2:#EBEBF599; --label3:#EBEBF54D; --sep:#38383A;
    --accent:#0A84FF;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.6);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--label);font-family:var(--font);
  font-size:17px;line-height:1.47;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  touch-action:manipulation;
}
img{background:var(--fill)}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{font-weight:600;letter-spacing:.01em;margin:0}

.wrap{max-width:720px;margin:0 auto;padding:0 16px}
@media (min-width:734px){ .wrap{max-width:760px} }

/* ---------- 顶部 ---------- */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep);padding:12px 0 10px}
.bar{display:flex;align-items:center;gap:12px}
.title{font-size:28px;font-weight:700;letter-spacing:.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who{font-size:12px;color:var(--label3);text-align:right;line-height:1.3;flex:0 0 auto;max-width:46%}
.who b{color:var(--success);font-weight:600}

.field{width:100%;height:44px;border:none;border-radius:var(--r-control);background:var(--fill);
  color:var(--label);font:inherit;font-size:17px;padding:0 14px;outline:none;margin-top:10px}
.field:focus{box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent)}
.field::placeholder{color:var(--label3)}

.seg{display:flex;gap:2px;background:var(--fill);border-radius:10px;padding:2px;margin-top:10px}
.seg button{flex:1;height:32px;border:none;border-radius:8px;background:transparent;
  color:var(--label);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:var(--shadow-sm);font-weight:600}
@media (prefers-color-scheme: dark){ .seg button.on{background:#636366} }

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 18px;border:none;border-radius:var(--r-control);
  background:var(--fill);color:var(--accent);font:inherit;font-size:17px;font-weight:500;
  cursor:pointer;transition:transform .2s var(--ease), opacity .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.plain{background:transparent;padding:0 4px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.4}
.btn.block{width:100%}
.btn.small{min-height:34px;font-size:14px;padding:0 12px;border-radius:10px}

/* ---------- 列表（整组一张卡片，行高≥44） ---------- */
.group{background:var(--card);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-sm);
  margin:12px 0}
.row{position:relative;display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:44px;
  color:inherit;cursor:pointer}
.row:active{background:var(--fill)}
.row:not(:last-child)::after{content:"";position:absolute;left:16px;right:0;bottom:0;
  height:1px;background:var(--sep)}
.row .thumb{width:100px;height:62px;flex:0 0 auto;border-radius:8px;object-fit:cover}
.row .thumb.round{width:52px;height:52px;border-radius:50%}
.row .body{min-width:0;flex:1}
.row .t{font-size:15px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .s{font-size:12px;color:var(--label3);margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
.row .s b{font-weight:500;color:var(--label2)}
.chev{color:var(--label3);flex:0 0 auto;font-size:20px}

.hint{color:var(--label3);font-size:13px;line-height:1.6;margin:12px 2px}
.empty{color:var(--label3);text-align:center;padding:56px 24px;font-size:15px;line-height:1.8}
.section-title{font-size:20px;font-weight:600;margin:28px 2px 8px}

/* ---------- 详情页 ---------- */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow:hidden}
.sheet.on{display:flex;flex-direction:column}
/* 关键：flex + min-height:0 才能把 .scroller 变成滚动容器。
   之前只写 height:100%，而父层 .panel 是 auto 高度，百分比高度直接失效，
   内容溢出到屏幕外又没任何元素可滚——这就是手机上滑不动的原因。 */
.panel{flex:1;min-height:0;display:flex;flex-direction:column;width:100%}
.scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep)}
.topbar b{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
@media (min-width:734px){
  .sheet{background:rgba(0,0,0,.42);padding:32px 0}
  .sheet .panel{max-width:760px;margin:0 auto;background:var(--bg);
    border-radius:var(--r-sheet);overflow:hidden;box-shadow:var(--shadow)}
}
.inner{padding:16px 16px 64px}
.inner h1{font-size:24px;line-height:1.3;margin-bottom:10px}
.hero{width:100%;border-radius:var(--r-card);margin:4px 0 14px;display:block}
.metaline{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--label3);margin-bottom:12px}
.bvid{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label3);
  background:var(--card);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.bvid code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--label);font-size:13px}
.bvid .btn{margin-left:auto}

.up{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);
  border-radius:var(--r-card);box-shadow:var(--shadow-sm);margin-bottom:12px;cursor:pointer}
.up img{width:44px;height:44px;border-radius:50%;flex:0 0 auto}
.up .n{flex:1;min-width:0}
.up .n b{display:block;font-size:15px}
.up .n span{font-size:12px;color:var(--label3)}

/* 四连按钮：图标 + 文字 + 数字 */
.acts{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);
  border-radius:var(--r-card);box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:12px}
.acts button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;min-height:64px;border:none;background:transparent;color:var(--label);
  font:inherit;font-size:12px;cursor:pointer;padding:6px 2px}
.acts button:active{background:var(--fill)}
.acts button:not(:first-child)::before{content:"";position:absolute;left:0;top:14px;bottom:14px;
  width:1px;background:var(--sep)}
.acts button.on{color:var(--accent)}
.acts button small{color:var(--label3);font-size:11px}
.acts button.on small{color:var(--accent)}
.actlog{font-size:12px;color:var(--label3);margin:-6px 2px 12px;line-height:1.5}

.desc{background:var(--card);border-radius:var(--r-card);padding:12px 14px;font-size:14px;
  color:var(--label2);white-space:pre-wrap;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.player video{width:100%;border-radius:var(--r-card);background:#000;display:block}
.article{font-size:16px;line-height:1.75;word-break:break-word}
.article img,.article video{max-width:100%;height:auto;border-radius:10px}
.article a{word-break:break-all}

/* 评论 */
.cmt{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--sep)}
.cmt:last-child{border-bottom:none}
.cmt img{width:34px;height:34px;border-radius:50%;flex:0 0 auto}
.cmt .c{min-width:0;flex:1}
.cmt .u{font-size:12px;color:var(--label3)}
.cmt .m{font-size:15px;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.cmt .s{font-size:11px;color:var(--label3);margin-top:5px;display:flex;gap:12px}

/* ---------- 弹层（移动端底部 sheet） ---------- */
.dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;
  align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.box{width:100%;max-width:100%;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
  animation:up .25s var(--ease)}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);opacity:.4;margin:8px auto 14px}
.box h3{font-size:17px;font-weight:600;margin-bottom:4px}
.box .sub{font-size:13px;color:var(--label3);margin-bottom:12px}
.grid-row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;
  border-top:1px solid var(--sep)}
.grid-row .k{flex:1;min-width:0;font-size:15px}
.grid-row .k small{display:block;color:var(--label3);font-size:12px;margin-top:2px}
@media (min-width:734px){
  .dlg{align-items:center}
  .box{max-width:440px;border-radius:var(--r-sheet);padding-bottom:20px;animation:none}
}
label.check{display:flex;align-items:center;gap:12px;min-height:48px;border-top:1px solid var(--sep);
  font-size:15px;cursor:pointer}
label.check input{width:22px;height:22px;accent-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(12px);
  background:rgba(0,0,0,.86);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;
  z-index:60;opacity:0;transition:.2s var(--ease);pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--fill);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="title">B站搜索器</div>
      <button class="btn small" id="histbtn">历史</button>
      <div class="who" id="me">…</div>
    </div>
    <form id="sf" autocomplete="off">
      <input class="field" type="search" id="q" placeholder="搜索视频、UP主、专栏"
             autocomplete="off" enterkeyhint="search">
    </form>
    <div class="seg" id="tabs">
      <button data-t="video" class="on">视频</button>
      <button data-t="bili_user">UP主</button>
      <button data-t="article">专栏</button>
    </div>
  </div>
</header>

<div class="wrap" style="padding-bottom:48px">
  <div id="list">
    <div class="empty">没有推荐流。<br>想清楚要看什么，再搜。</div>
  </div>
  <button class="btn block" id="more" hidden style="margin:8px 0 32px">下一页</button>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="scroller">
      <div class="topbar"><button class="btn plain" id="back">‹ 返回</button><b id="stitle"></b></div>
      <div class="inner" id="sbody"></div>
    </div>
  </div>
</div>

<div class="dlg" id="dlg"><div class="box" id="dlgbox"></div></div>
<div id="toast"></div>

<script>
/* ============ 基础 ============ */
const T = new URLSearchParams(location.search).get('t') || '';
const api = (p, o) => fetch(p + (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(T), o)
  .then(r => r.json());
const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => n >= 1e8 ? (n/1e8).toFixed(1)+'亿' : n >= 1e4 ? (n/1e4).toFixed(1)+'万' : (n ?? 0);
const ago = t => { if(!t) return ''; const x = Date.now()/1000 - t;
  return x < 3600 ? Math.floor(x/60)+'分钟前' : x < 86400 ? Math.floor(x/3600)+'小时前'
       : x < 86400*30 ? Math.floor(x/86400)+'天前' : new Date(t*1000).toISOString().slice(0,10); };
const mb = b => !b ? '未知大小'
  : (b >= 104857600 ? (b/1048576).toFixed(0) : (b/1048576).toFixed(1)) + ' MB';
function playHref(id){ return `/api/play?bvid=${encodeURIComponent(id)}&t=${encodeURIComponent(T)}`; }

const ICON = {
  like:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.3S4.5 15.6 4.5 10.4A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7.5 2.8c0 5.2-7.5 9.9-7.5 9.9z"/></svg>',
  likeOn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.3S4.5 15.6 4.5 10.4A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7.5 2.8c0 5.2-7.5 9.9-7.5 9.9z"/></svg>',
  coin:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8.6v6.8M8.6 12h6.8"/></svg>',
  star:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 4.2l2.5 5.3 5.8.7-4.3 3.9 1.2 5.7L12 17l-5.2 2.8 1.2-5.7L3.7 10.2l5.8-.7z"/></svg>',
  starOn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.2l2.5 5.3 5.8.7-4.3 3.9 1.2 5.7L12 17l-5.2 2.8 1.2-5.7L3.7 10.2l5.8-.7z"/></svg>',
  user:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.4"/><path d="M5.2 20c0-3.4 3-5.6 6.8-5.6s6.8 2.2 6.8 5.6"/></svg>',
  userOn:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8.4" r="3.4"/><path d="M5.2 20c0-3.4 3-5.6 6.8-5.6s6.8 2.2 6.8 5.6"/><path d="M17 4.5l1.6 1.6 3-3"/></svg>',
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5l11 6.5-11 6.5z"/></svg>',
  dl:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v11M7.8 10.8L12 15l4.2-4.2M5 19.5h14"/></svg>'
};

let toastTimer;
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms || 2600);
}
function dlg(title, html){
  // 每个弹层都自带标题栏 + 「完成」：之前只能点空白处关，太隐晦
  $('dlgbox').innerHTML = `<div class="grabber"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <h3 style="flex:1;margin:0">${title}</h3>
      <button class="btn small" onclick="closeDlg()">完成</button>
    </div>` + html;
  $('dlg').classList.add('on');
}
function closeDlg(){ $('dlg').classList.remove('on'); }
$('dlg').onclick = e => { if(e.target.id === 'dlg') closeDlg(); };
window.closeDlg = closeDlg;                       // 弹层里的内联 onclick 用得到

/* ============ 路由（刷新/前后退都要回到原来那页） ============ */
let currentRoute = '';
const routeOf = () => decodeURIComponent(location.hash.replace(/^#/, ''));
function go(route){
  if(route === currentRoute) return;
  currentRoute = route;
  if(routeOf() !== route) location.hash = route;
  renderRoute(route);
}
function renderRoute(route){
  const i = route.indexOf('/');
  const kind = i < 0 ? route : route.slice(0, i);
  const arg = i < 0 ? '' : route.slice(i + 1);
  if(kind === 'video' && arg) return openVideo(arg);
  if(kind === 'article' && arg) return openArticle(arg);
  if(kind === 'user' && arg) return openUser(arg);
  if(kind === 'history') return openHistory();
  closeSheet();
}
window.addEventListener('hashchange', () => {
  const r = routeOf();
  if(r !== currentRoute){ currentRoute = r; renderRoute(r); }
});

/* ============ 详情页外壳 ============ */
function showSheet(title){
  $('stitle').textContent = title;
  $('sheet').classList.add('on');
  document.querySelector('.scroller').scrollTop = 0;
}
function closeSheet(){ $('sheet').classList.remove('on'); }
$('back').onclick = () => go('');
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ go(''); closeDlg(); } });

/* ============ 登录状态 ============ */
api('/api/me').then(r => {
  if(!r.ok) return $('me').textContent = '未登录';
  const d = r.data;
  $('me').innerHTML = d.isLogin
    ? `<b>${esc(d.uname)}</b><br>Lv${d.level ?? '?'} · 硬币 ${d.coins}${d.csrf ? '' : ' · 缺 csrf'}`
    : '未登录<br>只能浏览';
  if(d.isLogin && !d.csrf) toast('cookie 里没有 bili_jct（CSRF），点赞/投币/收藏/关注都会失败：重跑一次 bili_login.py', 9000);
});

/* ============ 搜索 ============ */
let type = 'video', page = 1, lastQ = '';
const ITEMS = new Map();

$('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  type = b.dataset.t;
  [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b));
  if(lastQ) run(1);
};
$('sf').onsubmit = e => { e.preventDefault(); const q = $('q').value.trim(); if(q) run(1); };

async function run(p){
  lastQ = $('q').value.trim(); page = p;
  try { localStorage.setItem('bili.q', JSON.stringify({type, q: lastQ, page: p})); } catch(e){}
  $('more').hidden = true;
  if(p === 1) $('list').innerHTML = `<div class="empty"><span class="spin"></span>搜索中</div>`;
  const r = await api(`/api/search?type=${type}&q=${encodeURIComponent(lastQ)}&page=${p}`);
  if(!r.ok) return $('list').innerHTML = `<div class="empty">${esc(r.message)}</div>`;
  const items = r.data.items || [];
  if(!items.length) return $('list').innerHTML = `<div class="empty">没搜到，换个词试试。</div>`;
  items.forEach(it => ITEMS.set(it.kind + ':' + it.id, it));
  const html = `<div class="group">${items.map(row).join('')}</div>`;
  if(p === 1) $('list').innerHTML = html;
  else $('list').insertAdjacentHTML('beforeend', html);
  $('more').hidden = p >= (r.data.pages || 1);
}
$('more').onclick = () => run(page + 1);

function row(it){
  const img = `<img class="thumb${it.kind === 'user' ? ' round' : ''}" loading="lazy"
      referrerpolicy="no-referrer" src="${esc(it.pic || it.cover)}" alt="">`;
  if(it.kind === 'video') return `<div class="row" data-k="video" data-id="${esc(it.id)}">${img}
    <div class="body"><div class="t">${esc(it.title)}</div>

async function onAct(e, v){
  const b = e.target.closest('[data-a],[data-copy]');
  if(!b) return;
  if(b.dataset.copy){
    (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.copy) : Promise.reject())
      .then(() => toast('已复制 ' + b.dataset.copy), () => toast(b.dataset.copy));
    return;
  }
  const a = b.dataset.a;
  if(a === 'go-up') return go('user/' + v.owner.mid);
  if(a === 'play') return playVideo(v);
  if(a === 'dl') return dlDialog(v);
  if(a === 'diag') return runDiag(v);
  if(a === 'coin') return coinDialog(v);
  if(a === 'fav') return favDialog(v);

  const body = a === 'like' ? {act:'like', id:v.id, on: !v.liked}
             : a === 'follow' ? {act:'follow', fid:v.owner.mid, on: !(v.follow === 2 || v.follow === 6)} : null;
  if(!body) return;
  b.disabled = true;
  const r = await api('/api/do', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  b.disabled = false;
  if(!r.ok){
    // B 站的状态传播有几秒延迟：刚赞完立刻取消，它会回 65004「未点赞过」。
    // 这类报错说明目标状态已经达成，当成成功，不要提示失败。
    const msg = r.message || '';
    const benign = a === 'like'
      ? (!body.on && msg.includes('未点赞过')) || (body.on && msg.includes('已点赞'))
      : (body.on && msg.includes('已经关注')) || (!body.on && msg.includes('未关注'));
    if(!benign){
      setLog('失败 code=' + (r.code ?? '') + ' ' + msg, 'err');
      return toast('操作失败 ' + (r.code ?? '') + ' ' + msg, 5000);
    }
    setLog('已达成目标状态（B 站状态滞后，报错可忽略）');
  } else {
    setLog('成功 code=' + (r.code ?? 0) + ' ' + (r.message || 'OK'));
  }
  if(a === 'like'){
    v.liked = body.on;
    v.stat.like = (v.stat.like || 0) + (body.on ? 1 : -1);
    toast(body.on ? '已点赞' : '已取消点赞');
  } else {
    v.follow = body.on ? 2 : 0;
    toast(body.on ? '已关注 ' + v.owner.name : '已取消关注');
  }
  refreshActs(v);
}

/* 把最后一次写操作的结果留在页面上：toast 一闪而过，出问题时根本来不及看。 */
function setLog(text, cls){
  const el = $('actlog'); if(!el) return;
  el.textContent = text;
  el.style.color = cls === 'ok' ? 'var(--success)' : cls === 'err' ? 'var(--danger)' : 'var(--label3)';
}

/* 操作诊断：让服务器把 before → 写 → after 的原始响应全吐出来，原样贴在页面上（可长按复制）。
   只做一对可逆操作，净效果为零。 */
async function runDiag(v){
  setLog('诊断中，约 8 秒（两次写操作成对，不会改变最终状态）…');
  const r = await api('/api/diagnose?bvid=' + encodeURIComponent(v.id));
  if(!r.ok) return setLog('诊断接口失败：' + (r.code ?? '') + ' ' + (r.message || ''), 'err');
  const d = r.data;
  setLog(d.restored ? '诊断完成，状态已复原。数据在下方，长按可以复制' : '诊断完成，但状态可能未复原',
         d.restored ? 'ok' : 'err');
  const old = document.getElementById('diagout'); if(old) old.remove();
  const box = document.createElement('pre');
  box.id = 'diagout';
  box.textContent = JSON.stringify(d, null, 1);
  box.style.cssText = 'font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;'
    + 'background:var(--card);border-radius:12px;padding:10px;margin:8px 0 12px;user-select:text';
  const anchor = $('actlog');
  anchor.parentNode.insertBefore(box, anchor.nextSibling);
}

    pages: $('hpages').value});

  return '/api/' + (exp ? 'history/export' : 'history') + '?' + p;
}

    return `<div class="row" ${k}>
      <div class="body"><div class="t">${esc(it.title)}</div>
        <div class="s"><span>${esc(it.author || '—')}</span><span>${esc(it.view_at_local)}</span></div>
      </div><span class="chev">›</span></div>`;
  }).join('')}</div>`;
  box.onclick = e => {
    const c = e.target.closest('.row'); if(!c || !c.dataset.k) return;
    go(c.dataset.k === 'video' ? 'video/' + c.dataset.id : 'article/' + c.dataset.id);
  };
}

/* ============ 启动 ============ */
try {
  const s = JSON.parse(localStorage.getItem('bili.q') || 'null');
  if(s && s.q){
    type = s.type; $('q').value = s.q;
    [...$('tabs').children].forEach(x => x.classList.toggle('on', x.dataset.t === type));
    run(s.page || 1);
  }
} catch(e){}
currentRoute = routeOf();
renderRoute(currentRoute);
</script>
</body>
</html>
