name: flutter

# 平台脚手架（android/ windows/）不入库：里面有 gradle wrapper 之类的二进制文件，
# 手写容易出错，所以 CI 里用 flutter create 现场生成，再编译。
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.biliweb --project-name biliweb .
      - run: flutter pub get
      - run: flutter analyze

  apk:
    name: 构建 APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.biliweb --project-name biliweb .
      - run: flutter pub get
      # 模板默认用 debug keystore 签 release，所以产物可以直接侧载安装
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: biliweb-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: 构建 Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --org com.biliweb --project-name biliweb .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 打包成 zip（exe 不能单独运行，需要同目录的 dll 和数据文件）
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath biliweb-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: biliweb-windows
          path: app/biliweb-windows.zip
          if-no-files-found: error
