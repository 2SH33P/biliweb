name: flutter

# 平台脚手架（android/ windows/）不入库：里面有 gradle wrapper 之类的二进制文件，
# 手写容易出错，所以 CI 里用 flutter create 现场生成，再编译。
# 注意：push 必须同时声明 branches 和 tags。只写 paths 而不写 tags 时，
# tag ref 不匹配 branches，v* 推送不会触发任何 job。声明 tags 后，
# GitHub 不对 tag 推送评估 paths 过滤，tag 会正常触发分析/构建。
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - '.github/scripts/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  analyze:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.biliweb --project-name biliweb .
      - run: flutter pub get
      # 后台播放要改 AndroidManifest（前台服务 + 权限）和 minSdk，见脚本注释
      - run: python3 ../.github/scripts/patch_platform.py android
      - run: flutter analyze

  apk:
    name: 构建 APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.biliweb --project-name biliweb .
      - run: flutter pub get
      - run: python3 ../.github/scripts/patch_platform.py android
      # 模板默认用 debug keystore 签 release，所以产物可以直接侧载安装
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: biliweb-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: 构建 Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --org com.biliweb --project-name biliweb .
      - run: flutter pub get
      - name: 替换 Windows 图标
        shell: pwsh
        run: Copy-Item ../.github/assets/icon/biliweb.ico windows/runner/resources/app_icon.ico -Force
      - name: 构建 Windows（失败自动重试一次）
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "首次构建失败，清理后重试"
            flutter clean
            flutter pub get
            Copy-Item ../.github/assets/icon/biliweb.ico windows/runner/resources/app_icon.ico -Force
            flutter build windows --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 打包成 zip（exe 不能单独运行，需要同目录的 dll 和数据文件）
        working-directory: app
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath biliweb-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: biliweb-windows
          path: app/biliweb-windows.zip
          if-no-files-found: error

  # 只有推 v* tag 才发 Release；普通 push/PR 只在 Actions Artifacts 里留产物。
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: biliweb-apk
          path: dist/apk
      - uses: actions/download-artifact@v4
        with:
          name: biliweb-windows
          path: dist/windows
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/apk/*.apk
            dist/windows/biliweb-windows.zip
