name: biliweb
description: 第三方 B站客户端，仅供学习使用
publish_to: none
version: 0.3.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.6
  # 播放：media_kit = libmpv，是少数能直接吃 B站 DASH 分流（视频 + 外挂音轨）的播放器
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4
  # 后台播放：锁屏控制、通知栏、退后台不停
  audio_service: ^0.18.15
  audio_session: ^0.1.18
  path_provider: ^2.1.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
